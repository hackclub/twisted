[project]
name = "twistedos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "authlib>=1.7.2",
    "django>=6.0.7",
    "django-cotton>=2.7.2",
    "django-jazzmin>=3.0.5",
    "django-tailwind[cookiecutter,honcho,reload]>=4.5.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "slack-bolt>=1.30.0",
    "tzdata>=2026.3",
    "urllib3>=2.7.0",
    "whitenoise>=6.12.0",
    "boto3>=1.43.66",
    "django-cotton-ui>=0.3.2",
    "django-google-charts>=0.1.1",
    "django-qsstats-magic>=1.1.0",
    "django-htmx>=1.29.0",
    "django-extensions>=4.1",
    "django-mathfilters>=1.0.0",
    "django-humanize>=0.1.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = ["C901", "CPY001", "D100", "D101", "D102", "D103", "D203", "D212", "D401", "E501", "PLR0911", "PLR0912", "PLR0915", "S102", "S105"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pyrefly]
infer-with-first-use = false
