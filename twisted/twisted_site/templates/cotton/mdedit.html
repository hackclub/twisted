<div class="flex flex-col flex-1 min-h-0 min-w-0 {{ class }} font-vintage">
    <div id="restorebanner"
         class="hidden shrink-0 items-center justify-between gap-2 bg-warning/30 border-b border-warning px-3 py-2 text-sm">
        <span>A saved draft was found. Restore it?</span>
        <div class="flex gap-2 shrink-0">
            <button type="button"
                    onclick="restoreSavedDraft()"
                    class="px-2 py-1 bg-primary text-primary-foreground border border-border hover:bg-primary/80">
                Restore
            </button>
            <button type="button"
                    onclick="dismissSavedDraft()"
                    class="px-2 py-1 bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                Dismiss
            </button>
        </div>
    </div>
    <div class="shrink-0 flex items-center gap-1 bg-card border-b border-border p-1">
        <button id="editbutton"
                type="button"
                onclick="switchedit()"
                disabled
                class="px-3 py-1 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
            Write
        </button>
        <button id="previewbutton"
                type="button"
                onclick="switchpreview()"
                class="px-3 py-1 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
            Preview
        </button>
    </div>
    <div class="flex-1 min-h-0 min-w-0 overflow-hidden">
        <div id="edittab" class="flex flex-col w-full h-full min-h-0">
            <div class="py-1 px-3 flex gap-2 border-b border-border">
                <button type="button" onclick="makeBold()" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linejoin="round" d="M6.75 3.744h-.753v8.25h7.125a4.125 4.125 0 0 0 0-8.25H6.75Zm0 0v.38m0 16.122h6.747a4.5 4.5 0 0 0 0-9.001h-7.5v9h.753Zm0 0v-.37m0-15.751h6a3.75 3.75 0 1 1 0 7.5h-6m0-7.5v7.5m0 0v8.25m0-8.25h6.375a4.125 4.125 0 0 1 0 8.25H6.75m.747-15.38h4.875a3.375 3.375 0 0 1 0 6.75H7.497v-6.75Zm0 7.5h5.25a3.75 3.75 0 0 1 0 7.5h-5.25v-7.5Z"></path></svg>
                </button>
                <!-- TODO: implement dis
                    <button type="button" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"></path><path d="M6 20V4"></path><path d="M18 20V4"></path></svg>
                    </button>
                -->
                <button type="button" onclick="makeItalic()" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.248 20.246H9.05m0 0h3.696m-3.696 0 5.893-16.502m0 0h-3.697m3.697 0h3.803"></path></svg>
                </button>
                <div class="border border-border/50 rounded-xl"></div>
                <!-- TODO: implement dis
                    <button type="button" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6H3"></path><path d="M21 12H8"></path><path d="M21 18H8"></path><path d="M3 12v6"></path></svg>
                    </button>
                -->
                <button type="button" onclick="makeCodeBlock()" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                </button>
                <button type="button" onclick="insertUrl('url')" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"></path></svg>
                </button>
                <div class="border border-border/50 rounded-xl"></div>
                <button type="button" onclick="triggerImageUpload()" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"></path></svg>
                </button>
                <!-- TODO: implement dis
                    <button type="button" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"></path></svg>
                    </button>
                    <button type="button" class="p-2 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.242 5.992h12m-12 6.003H20.24m-12 5.999h12M4.117 7.495v-3.75H2.99m1.125 3.75H2.99m1.125 0H5.24m-1.92 2.577a1.125 1.125 0 1 1 1.591 1.59l-1.83 1.83h2.16M2.99 15.745h1.125a1.125 1.125 0 0 1 0 2.25H3.74m0-.002h.375a1.125 1.125 0 0 1 0 2.25H2.99"></path></svg>
                    </button>
                -->
            </div>
            <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageFileSelected(event)">
            <textarea name="content"
                      id="content"
                      class="block w-full h-full min-h-0 resize-none bg-background text-foreground p-3 font-mono border-0 outline-none"
                      placeholder="Write your journal entry here. Ctrl+V an image into this textbox to insert it. (supports markdown!)"
                      oninput="renderpreview()">{{ content }}</textarea>
            <div onclick="triggerImageUpload()" class="cursor-pointer py-1 px-3 flex gap-2 border-t border-border text-white/60 hover:text-white hover:bg-border/50 transition-all duration-200">
                Paste or click to add images
            </div>
            <!--<div class="px-3 pt-1 border-t border-border bg-background flex gap-3">
                <div class="grow">
                    Draft saved locally.
                </div>
                <div>
                    Min characters <span id="charCount">0</span>/100
                </div>
                <div>
                    Min images <span id="imgCount">0</span>/1
                </div>
            </div>-->
        </div>
        <div id="previewtab" class="hidden w-full h-full min-h-0">
            <div class="w-full h-full overflow-y-auto bg-background p-4">
                <div id="preview"
                     class="w-full max-w-full wrap-break-word text-foreground [&_h1]:text-2xl [&_h1]:font-bold [&_h2]:text-xl [&_h2]:font-bold [&_h3]:text-lg [&_h3]:font-bold [&_ul]:list-disc [&_ul]:pl-6 [&_ol]:list-decimal [&_ol]:pl-6 [&_p]:my-2 [&_a]:underline [&_a]:text-primary [&_img]:max-w-full">
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const textbox = document.querySelector("#content");
    const csrfToken = "{{ csrf_token }}";

    const saveId = "{{ save_id }}";
    const draftStorageKey = saveId ? `mdedit-draft:${saveId}` : null;

    function wrapText(wrapper) {
        const start = textbox.selectionStart;
        const end = textbox.selectionEnd;
        if (textbox.value.substring(start-wrapper.length, start) == wrapper && textbox.value.substring(end, end+wrapper.length) == wrapper) {
            const replacement = textbox.value.substring(start, end);
            textbox.value = textbox.value.substring(0, start-wrapper.length) + replacement + textbox.value.substring(end+wrapper.length);
            textbox.focus();
            textbox.setSelectionRange(start - wrapper.length, end - wrapper.length);
        } else {
            const selectedText = textbox.value.substring(start, end);
            const replacement = `${wrapper}${selectedText}${wrapper}`;
            textbox.value = textbox.value.substring(0, start) + replacement + textbox.value.substring(end);
            textbox.focus();
            textbox.setSelectionRange(start + wrapper.length, end + wrapper.length);
        }
    }

    function makeBold() {
        wrapText('**')
    }
    function makeItalic() {
        wrapText('_')
    }
    function makeCodeBlock() {
        wrapText('```')
    }

    function insertUrl(url="url") {
        const start = textbox.selectionStart;
        const end = textbox.selectionEnd;
        const selectedText = textbox.value.substring(start, end);
        const replacement = `[${selectedText}](${url})`;
        textbox.value = textbox.value.substring(0, start) + replacement + textbox.value.substring(end);
        textbox.focus();
        if (!selectedText) {
            textbox.setSelectionRange(start+1, start+1);
        } else {
            textbox.setSelectionRange(end+3, end+3+url.length);
        }
    }

    function readSavedDraft() {
        if (!draftStorageKey) {
            return null;
        }

        try {
            return localStorage.getItem(draftStorageKey);
        } catch (e) {
            return null;
        }
    }

    function saveDraft() {
        if (!draftStorageKey) {
            return;
        }

        try {
            localStorage.setItem(draftStorageKey, textbox.value);
        } catch (e) {
            // localStorage unavailable (private browsing, quota exceeded, etc.)
        }
    }

    function clearSavedDraft() {
        if (!draftStorageKey) {
            return;
        }

        try {
            localStorage.removeItem(draftStorageKey);
        } catch (e) {
            // ignore
        }
    }

    function restoreSavedDraft() {
        const saved = readSavedDraft();

        if (saved !== null) {
            textbox.value = saved;
            renderpreview();
        }

        document.getElementById("restorebanner").classList.add("hidden");
        document.getElementById("restorebanner").classList.remove("flex");
    }

    function dismissSavedDraft() {
        document.getElementById("restorebanner").classList.add("hidden");
        document.getElementById("restorebanner").classList.remove("flex");
    }

    if (draftStorageKey) {
        const saved = readSavedDraft();

        if (saved !== null && saved !== textbox.value) {
            if (textbox.value.trim() === "") {
                textbox.value = saved;
                renderpreview();
            } else {
                document.getElementById("restorebanner").classList.remove("hidden");
                document.getElementById("restorebanner").classList.add("flex");
            }
        }

        setInterval(saveDraft, 1_000);

        const form = textbox.closest("form");

        if (form) {
            form.addEventListener("submit", clearSavedDraft);
        }
    }

    function generateRandomString(length) {
        const chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        let result = "";

        for (let i = 0; i < length; i++) {
            result += chars.charAt(
                Math.floor(Math.random() * chars.length)
            );
        }

        return result;
    }

    function renderpreview() {
        const content = textbox.value;

        const parsed = DOMPurify.sanitize(
            marked.parse(content)
        );

        document.getElementById("preview").innerHTML = parsed;
    }

    function switchedit() {
        document.getElementById("previewtab").classList.add("hidden");
        document.getElementById("edittab").classList.remove("hidden");

        document.getElementById("editbutton").disabled = true;
        document.getElementById("previewbutton").disabled = false;

        textbox.focus();
    }

    function switchpreview() {
        document.getElementById("edittab").classList.add("hidden");
        document.getElementById("previewtab").classList.remove("hidden");

        document.getElementById("editbutton").disabled = false;
        document.getElementById("previewbutton").disabled = true;

        renderpreview();
    }

    function uploadImage(blob) {
        const id =
            `![Uploading... ${generateRandomString(5)}]()`;

        textbox.value += `${id}\n`;

        const formData = new FormData();

        formData.append(
            "csrfmiddlewaretoken",
            csrfToken
        );

        formData.append("file", blob);
        formData.append("ref", "journals");

        fetch("{% url 'misc.upload_file' %}", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(result => {

                if (result.status === "ok") {

                    textbox.value =
                        textbox.value.replace(
                            id,
                            `![${result.name}](${result.link})`
                        );

                } else {

                    textbox.value =
                        textbox.value.replace(
                            id,
                            `![Error: ${result.reason}]()`
                        );
                }

                renderpreview();
            });
    }

    function triggerImageUpload() {
        document.getElementById("imageFileInput").click();
    }

    function handleImageFileSelected(event) {
        const files = event.target.files;

        for (let i = 0; i < files.length; i++) {
            uploadImage(files[i]);
        }

        event.target.value = "";
    }

    textbox.addEventListener("paste", (event) => {
        const items =
            (event.clipboardData || window.clipboardData).items;

        for (let i = 0; i < items.length; i++) {

            if (!items[i].type.startsWith("image/")) {
                continue;
            }

            const blob = items[i].getAsFile();

            uploadImage(blob);
        }
    });
</script>
