<div class="flex flex-col flex-1 min-h-0 min-w-0 {{ class }} font-vintage">

    <div class="shrink-0 flex items-center gap-1 bg-card border-b border-border p-1">
        <button id="editbutton" type="button" onclick="switchedit()" disabled
            class="px-3 py-1 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
            Edit
        </button>

        <button id="previewbutton" type="button" onclick="switchpreview()"
            class="px-3 py-1 disabled:bg-primary disabled:text-primary-foreground bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
            Preview
        </button>
    </div>

    <div class="flex-1 min-h-0 min-w-0 overflow-hidden">

        <div id="edittab" class="flex w-full h-full min-h-0">
            <textarea name="content" id="content"
                class="block w-full h-full min-h-0 resize-none bg-background text-foreground p-3 font-mono border-0 outline-none"
                placeholder="Write your journal entry here..." oninput="renderpreview()">{{ content }}</textarea>
        </div>

        <div id="previewtab" class="hidden w-full h-full min-h-0">
            <div class="w-full h-full overflow-y-auto bg-background p-4">
                <div id="preview"
                    class="w-full max-w-full wrap-break-word text-foreground [&_h1]:text-2xl [&_h1]:font-bold [&_h2]:text-xl [&_h2]:font-bold [&_h3]:text-lg [&_h3]:font-bold [&_ul]:list-disc [&_ul]:pl-6 [&_ol]:list-decimal [&_ol]:pl-6 [&_p]:my-2 [&_a]:underline [&_a]:text-primary [&_img]:max-w-full">
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const textbox = document.querySelector("#content");
    const csrfToken = "{{ csrf_token }}";

    function generateRandomString(length) {
        const chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        let result = "";

        for (let i = 0; i < length; i++) {
            result += chars.charAt(
                Math.floor(Math.random() * chars.length)
            );
        }

        return result;
    }

    function renderpreview() {
        const content = textbox.value;

        const parsed = DOMPurify.sanitize(
            marked.parse(content)
        );

        document.getElementById("preview").innerHTML = parsed;
    }

    function switchedit() {
        document.getElementById("previewtab").classList.add("hidden");
        document.getElementById("edittab").classList.remove("hidden");

        document.getElementById("editbutton").disabled = true;
        document.getElementById("previewbutton").disabled = false;

        textbox.focus();
    }

    function switchpreview() {
        document.getElementById("edittab").classList.add("hidden");
        document.getElementById("previewtab").classList.remove("hidden");

        document.getElementById("editbutton").disabled = false;
        document.getElementById("previewbutton").disabled = true;

        renderpreview();
    }

    textbox.addEventListener("paste", (event) => {
        const items =
            (event.clipboardData || window.clipboardData).items;

        for (let i = 0; i < items.length; i++) {

            if (!items[i].type.startsWith("image/")) {
                continue;
            }

            const blob = items[i].getAsFile();

            const id =
                `![Uploading... ${generateRandomString(5)}]()`;


            textbox.value += id + "\n";

            const formData = new FormData();

            formData.append(
                "csrfmiddlewaretoken",
                csrfToken
            );

            formData.append("file", blob);
            formData.append("ref", "journals");

            fetch("{% url 'misc.upload_file' %}", {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(result => {

                    if (result.status === "ok") {

                        textbox.value =
                            textbox.value.replace(
                                id,
                                `![${result.name}](${result.link})`
                            );

                    } else {

                        textbox.value =
                            textbox.value.replace(
                                id,
                                `![Error: ${result.reason}]()`
                            );
                    }

                    renderpreview();
                });
        }
    });
</script>
