{% load static tailwind_tags django_htmx %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% htmx_script %}
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    {% tailwind_css %}
    <title>Admin - Twisted</title>
    <link rel="icon" href="{% static 'favicon.png' %}" />
    {{ head }}
</head>
<body class="dark bg-[#09090B] text-white font-latin" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
    <c-ui.toast.container />
    {% if error %}
        <div id="errorMessage" data-message="{{ error|default:'no error found!' }}">
            <script>
                message = document.querySelector('#errorMessage').dataset.message
                setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('toast', { detail: { message: message, variant: 'error' }}))
                }, 100)
            </script>
        </div>
    {% endif %}

    <div class="flex flex-col md:flex-row md:py-2 h-screen">
        <div class="md:h-full">
            <c-sidebar>
                {% for link in sidebar_links %}
                <c-sidebar.item icon="{{ link.icon }}" href="{{ link.href }}" active="{% if page == link.name %}True{% endif %}">{{ link.text }}</c-sidebar.item>
                {% endfor %}
            </c-sidebar>
        </div>
        <div class="p-2 flex-1 overflow-y-auto">
            {{ slot }}
        </div>
    </div>

    <!-- Cotton UI bundle first: it registers components on Alpine's alpine:init event -->
    <script defer src="{% static 'django_cotton_ui/cotton-ui.min.js' %}"></script>

    <!-- Alpine.js plugins, then Alpine core (deferred scripts run in order) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    {% if messages %}
    {% for message in messages %}
        <div id="djangomessage{{ forloop.counter }}" data-message="{{ message }}">
            <script>
                window.addEventListener('load', (event) => {
                    message = document.querySelector('#djangomessage{{ forloop.counter }}').dataset.message
                    setTimeout(() => {
                        console.log("sending message "+message+"...")
                        window.dispatchEvent(new CustomEvent('toast', { detail: { message: message, variant: '{{ message.tags }}' }}))
                    }, 100)
                })
            </script>
        </div>
    {% endfor %}
    {% endif %}
</body>
</html>
