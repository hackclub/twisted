{% load tz %}
{% get_current_timezone as TIMEZONE %}
<c-base>
    <div>
        <c-ui.breadcrumbs>
            <c-ui.breadcrumbs.item href="{% url 'admin.dash' %}">Admin</c-ui.breadcrumbs.item>
            <c-ui.breadcrumbs.item href="{% url 'admin.pathways' %}">Pathways</c-ui.breadcrumbs.item>
            <c-ui.breadcrumbs.item href="{% url 'admin.pathway_groups' %}">Groups</c-ui.breadcrumbs.item>
            <c-ui.breadcrumbs.item :current="True">
                New
            </c-ui.breadcrumbs.item>
        </c-ui.breadcrumbs>
        <h1 class="text-2xl font-bold mt-2">Create Pathway Group</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mt-2 flex flex-col gap-2">
                <c-ui.input label="Group name"
                            name="name"
                            placeholder="Round 1"
                            required="True"
                            value="{{ group_name }}" />
                <div class="flex flex-col lg:flex-row gap-2 w-full *:w-full">
                    <div>
                        <c-ui.label>
                            Start
                        </c-ui.label>
                        <div class="flex gap-2 *:w-full">
                            <c-ui.datepicker mode="single" name="startDate" value="{{ start_date }}" required />
                            <c-ui.input type="time" name="startTime" value="{{ start_time }}" required />
                        </div>
                    </div>
                    <div class="hidden lg:block border border-zinc-800 flex-0"></div>
                    <div>
                        <c-ui.label>
                            End
                        </c-ui.label>
                        <div class="flex gap-2 *:w-full">
                            <c-ui.datepicker mode="single" name="endDate" value="{{ end_date }}" required />
                            <c-ui.input type="time" name="endTime" value="{{ end_time }}" required />
                        </div>
                    </div>
                </div>
                <div>
                    <c-ui.alert>
                        Start/End is in {{ TIMEZONE }} (your local time). This window cannot overlap with an existing pathway group.
                    </c-ui.alert>
                </div>
                <c-ui.button class="lg:w-min" type="submit" variant="primary">
                    Create Group
                </c-ui.button>
            </div>
        </form>
    </div>
</c-base>
