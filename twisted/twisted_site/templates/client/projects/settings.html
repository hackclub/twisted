{% extends "client/osbase.html" %}
{% load static time_filters maths %}

{% block body %}
<div class="bg-surface text-foreground flex flex-col w-full h-full font-vintage overflow-y-auto">
    <div class="flex items-center justify-between p-2 border-b border-border bg-card scrollbar-thin">
        <a href="{% url 'fr.projects.detail' project.id %}">
            <button type="button"
                class="px-3 py-1 bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                ← Go back
            </button>
        </a>

        <div class="text-lg font-bold">
            Project settings
        </div>
    </div>

    <form method="post" class="p-4 space-y-3">
        {% csrf_token %}

        <div class="flex flex-col gap-1">
            <label for="name" class="font-bold">
                Project name
            </label>

            <input id="name" name="name" required type="text" value="{{ project.project_name }}"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />
        </div>

        <div class="flex flex-col gap-1">
            <label for="description" class="font-bold">
                Project description
            </label>

            <textarea id="description" required name="description" rows="4"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 resize-y focus:outline-none focus:ring-1 focus:ring-ring">{{ project.project_description }}</textarea>
        </div>

        <div class="flex flex-col gap-1">
            <label for="type" class="font-bold">
                Project type
            </label>

            <select id="type" name="type" required
                class="w-full bg-card text-card-foreground border border-border px-2 py-1">

                {% if project.project_type == "software" %}
                <option value="software" selected>
                    Software
                </option>
                <option value="hardware" class="text-muted-foreground">
                    Hardware
                </option>
                {% else %}
                <option value="software" class="text-muted-foreground">
                    Software
                </option>
                <option value="hardware" selected>
                    Hardware
                </option>
                {% endif %}

            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label for="hackatime" class="font-bold">
                Hackatime project
            </label>

            <select id="hackatime" name="hackatime"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1">

                {% if not project.hackatime_project_name %}
                <option value="" disabled selected hidden class="text-muted-foreground">
                    Select a project
                </option>
                {% endif %}

                {% for hack_project in hackatime_projects %}
                {% if hack_project.total_seconds > 300 %}
                {% if project.hackatime_project_name == hack_project.name %}
                <option value="{{ hack_project.name }}" selected>
                    {{ hack_project.name }}
                    ({{ hack_project.total_seconds|divide:60|minutes_to_hours_minutes }})
                </option>
                {% else %}
                <option value="{{ hack_project.name }}">
                    {{ hack_project.name }}
                    ({{ hack_project.total_seconds|divide:60|minutes_to_hours_minutes }})
                </option>
                {% endif %}
                {% endif %}
                {% endfor %}

            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label for="repo" class="font-bold">
                Repo URL
            </label>

            <input id="repo" name="repo" type="text" placeholder="https://github.com/username/project"
                value="{{ project.repo_url }}"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />
        </div>

        <div class="flex flex-col gap-1">
            <label for="playable_url" class="font-bold">
                Playable URL
            </label>

            <input id="playable_url" name="playable_url" type="text" placeholder="{% if project.project_type == 'hardware' %}https://youtube.com/watch?v=abcdef{% else %}https://myapp.website.com{% endif %}"
                value="{{ project.playable_url }}"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />
        </div>

        <div class="flex flex-col gap-1">
            <label for="screenshot" class="font-bold">
                Screenshot
            </label>

            {% if project.screenshot_url %}
            <img id="screenshot_preview" src="{{ project.screenshot_url }}" alt="Project screenshot"
                class="max-h-48 w-auto border border-border object-contain bg-card" />
            {% else %}
            <img id="screenshot_preview" src="" alt="" class="hidden max-h-48 w-auto border border-border object-contain bg-card" />
            {% endif %}

            <input id="screenshot" type="file" accept="image/*"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />

            <span class="text-xs text-muted-foreground">or paste an image anywhere on this page</span>

            <span id="screenshot_status" class="text-xs text-muted-foreground"></span>

            <input id="screenshot_url" name="screenshot_url" type="hidden" value="{{ project.screenshot_url }}" />
        </div>

        <div class="pt-2">
            <button type="submit"
                class="px-4 py-2 bg-primary text-primary-foreground border-2 border-border hover:bg-primary/80">
                Save changes?
            </button>
        </div>

    </form>
</div>

<script>
    const screenshotInput = document.getElementById("screenshot");
    const screenshotUrlField = document.getElementById("screenshot_url");
    const screenshotPreview = document.getElementById("screenshot_preview");
    const screenshotStatus = document.getElementById("screenshot_status");

    function uploadScreenshot(file) {
        screenshotStatus.textContent = "Uploading...";

        const formData = new FormData();
        formData.append("csrfmiddlewaretoken", "{{ csrf_token }}");
        formData.append("file", file);
        formData.append("ref", "project_screenshot");

        fetch("{% url 'misc.upload_file' %}", {
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(result => {
                if (result.status === "ok") {
                    screenshotUrlField.value = result.link;
                    screenshotPreview.src = result.link;
                    screenshotPreview.classList.remove("hidden");
                    screenshotStatus.textContent = "";
                } else {
                    screenshotStatus.textContent = `Error: ${result.reason || result.error}`;
                }
            })
            .catch(() => {
                screenshotStatus.textContent = "Error: upload failed";
            });
    }

    screenshotInput.addEventListener("change", () => {
        const file = screenshotInput.files[0];
        if (!file) {
            return;
        }

        uploadScreenshot(file);
    });

    document.addEventListener("paste", (event) => {
        const items = (event.clipboardData || window.clipboardData).items;

        for (let i = 0; i < items.length; i++) {
            if (!items[i].type.startsWith("image/")) {
                continue;
            }

            const blob = items[i].getAsFile();
            if (blob) {
                uploadScreenshot(blob);
            }

            break;
        }
    });
</script>
{% endblock body %}
