{% extends "client/osbase.html" %}
{% load static time_filters maths %}

{% block body %}
<div class="bg-surface text-foreground flex flex-col w-full h-full font-vintage overflow-y-auto">
    <div class="flex items-center justify-between p-2 border-b border-border bg-card scrollbar-thin">
        <a href="{% url 'fr.projects.detail' project.id %}">
            <button type="button"
                class="px-3 py-1 bg-secondary text-secondary-foreground border border-border hover:bg-primary hover:text-primary-foreground">
                ← Go back
            </button>
        </a>

        <div class="text-lg font-bold">
            Project settings
        </div>
    </div>

    <form method="post" class="p-4 space-y-3">
        {% csrf_token %}

        <div class="flex flex-col gap-1">
            <label for="name" class="font-bold">
                Project name
            </label>

            <input id="name" name="name" required type="text" value="{{ project.project_name }}"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />
        </div>

        <div class="flex flex-col gap-1">
            <label for="description" class="font-bold">
                Project description
            </label>

            <textarea id="description" required name="description" rows="4"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 resize-y focus:outline-none focus:ring-1 focus:ring-ring">{{ project.project_description }}</textarea>
        </div>

        <div class="flex flex-col gap-1">
            <label for="type" class="font-bold">
                Project type
            </label>

            <select id="type" name="type" required
                class="w-full bg-card text-card-foreground border border-border px-2 py-1">

                {% if project.project_type == "software" %}
                <option value="software" selected>
                    Software
                </option>
                <option value="hardware" class="text-muted-foreground">
                    Hardware
                </option>
                {% else %}
                <option value="software" class="text-muted-foreground">
                    Software
                </option>
                <option value="hardware" selected>
                    Hardware
                </option>
                {% endif %}

            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label for="hackatime" class="font-bold">
                Hackatime project
            </label>

            <select id="hackatime" name="hackatime"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1">

                {% if not project.hackatime_project_name %}
                <option value="" disabled selected hidden class="text-muted-foreground">
                    Select a project
                </option>
                {% endif %}

                {% for hack_project in hackatime_projects %}
                {% if hack_project.total_seconds > 300 %}
                {% if project.hackatime_project_name == hack_project.name %}
                <option value="{{ hack_project.name }}" selected>
                    {{ hack_project.name }}
                    ({{ hack_project.total_seconds|divide:60|minutes_to_hours_minutes }})
                </option>
                {% else %}
                <option value="{{ hack_project.name }}">
                    {{ hack_project.name }}
                    ({{ hack_project.total_seconds|divide:60|minutes_to_hours_minutes }})
                </option>
                {% endif %}
                {% endif %}
                {% endfor %}

            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label for="repo" class="font-bold">
                Repo URL
            </label>

            <input id="repo" name="repo" type="text" placeholder="https://github.com/username/project"
                value="{{ project.repo_url }}"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />
        </div>

        <div class="flex flex-col gap-1">
            <label for="playable_url" class="font-bold">
                Playable URL
            </label>

            <input id="playable_url" name="playable_url" type="text" placeholder="{% if project.project_type == 'hardware' %}https://youtube.com/watch?v=abcdef{% else %}https://myapp.website.com{% endif %}"
                value="{{ project.playable_url }}"
                class="w-full bg-card text-card-foreground border border-border px-2 py-1 focus:outline-none focus:ring-1 focus:ring-ring" />
        </div>

        <div class="pt-2">
            <button type="submit"
                class="px-4 py-2 bg-primary text-primary-foreground border-2 border-border hover:bg-primary/80">
                Save changes?
            </button>
        </div>

    </form>
</div>
{% endblock body %}
